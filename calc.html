<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/buttons.css" />
  </head>

  <body>
    <div class="calculatorArea">
      <div class="historySide">
        <h2 class="historyHeader">There is your history:</h2>
        <br />
        <p class="history">deneme</p>
      </div>

      <div id="calculator">
        <input id="display" readonly />
        <!--bu bizim çıktı ekranımız -->

        <div id="keys">
          <button class="operators" onclick="clearDisplay()">C</button>
          <button class="operators" onclick="clearLastInput()">Ce</button>
          <button class="operators" onclick="appendToDisplay('%')">%</button>
          <button class="operators" onclick="appendToDisplay('/')">/</button>

          <button onclick="appendToDisplay('1')">1</button>
          <button onclick="appendToDisplay('2')">2</button>
          <button onclick="appendToDisplay('3')">3</button>
          <button class="operators" onclick="appendToDisplay('*')">*</button>

          <button onclick="appendToDisplay('4')">4</button>
          <button onclick="appendToDisplay('5')">5</button>
          <button onclick="appendToDisplay('6')">6</button>
          <button class="operators" onclick="appendToDisplay('-')">-</button>

          <button onclick="appendToDisplay('7')">7</button>
          <button onclick="appendToDisplay('8')">8</button>
          <button onclick="appendToDisplay('9')">9</button>
          <button class="operators" onclick="appendToDisplay('+')">+</button>

          <button onclick="brackets()">()</button>
          <button onclick="appendToDisplay('0')">0</button>
          <button onclick="appendToDisplay('.')">.</button>
          <button class="operators" onclick="calculate()">=</button>

          <script src="javascript/calculate.js"></script>
        </div>
      </div>
    </div>
  </body>
</html>
