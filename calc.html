<!DOCTYPE html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="styles/style.css" />
  <link rel="stylesheet" href="styles/buttons.css" />
</head>

<body>
  <div class="calculatorArea">
    <div class="historySide">
      <h2 class="historyHeader">There is your history:</h2>
      <br />

      <ul class="history">
        <!-- bu geçmiş işlemleri listeleyecek -->
      </ul>

      <button id="clearHistory" onclick="clearHistory()">Clear All</button>
    </div>

    <div id="calculator">
      <input
        type="text"
        id="display"
        aria-label="Calculator Screen"
        aria-live="polite"
        readonly
      />
      <!--bu bizim çıktı ekranımız -->

      <div id="keys">
        <button class="operators" aria-label="Temizle" onclick="clearDisplay()">
          C
        </button>

        <button
          class="operators"
          aria-label="Mod"
          onclick="appendToDisplay('%')"
        >
          %
        </button>

        <button
          class="operators"
          aria-label="Bölme"
          onclick="appendToDisplay('/')"
        >
          /
        </button>

        <button class="operators" aria-label="Sil" onclick="clearLastInput()">
          ⌫
        </button>

        <button aria-label="Bir" onclick="appendToDisplay('1')">1</button>
        <button aria-label="İki" onclick="appendToDisplay('2')">2</button>
        <button aria-label="Üç" onclick="appendToDisplay('3')">3</button>

        <button
          class="operators"
          aria-label="Çarpma"
          onclick="appendToDisplay('*')"
        >
          *
        </button>

        <button aria-label="Dört" onclick="appendToDisplay('4')">4</button>
        <button aria-label="Beş" onclick="appendToDisplay('5')">5</button>
        <button aria-label="Altı" onclick="appendToDisplay('6')">6</button>

        <button
          class="operators"
          aria-label="Çıkarma"
          onclick="appendToDisplay('-')"
        >
          -
        </button>

        <button aria-label="Yedi" onclick="appendToDisplay('7')">7</button>
        <button aria-label="Sekiz" onclick="appendToDisplay('8')">8</button>
        <button aria-label="Dokuz" onclick="appendToDisplay('9')">9</button>

        <button
          aria-label="Toplama"
          class="operators"
          onclick="appendToDisplay('+')"
        >
          +
        </button>

        <button aria-label="Parantez" onclick="brackets()">()</button>
        <button aria-label="Sıfır" onclick="appendToDisplay('0')">0</button>
        <button aria-label="Nokta" onclick="appendToDisplay('.')">.</button>

        <button class="operators" aria-label="Hesapla" onclick="calculate()">
          =
        </button>

        <script src="javascript/calculate.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mathjs@14.8.0/lib/browser/math.min.js"></script>
      </div>
    </div>
  </div>
</body>
